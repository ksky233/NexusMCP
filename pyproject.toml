[project]
name = "nexusmcp"
version = "0.1.0"
description = "Enterprise MCP Gateway and Registry"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.19,<2",
    "asyncpg>=0.30,<1",
    "fastapi>=0.116,<1",
    "httpx>=0.28,<1",
    "jsonschema>=4.26,<5",
    "mcp==2.0.0",
    "opentelemetry-api>=1.44,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.44,<2",
    "opentelemetry-sdk>=1.44,<2",
    "pgvector>=0.5,<1",
    "pydantic-settings>=2.10,<3",
    "sqlalchemy[asyncio]>=2.0.52,<2.1",
    "uvicorn>=0.35,<1",
]

[dependency-groups]
dev = [
    "basedpyright>=1.31,<2",
    "psutil>=7.2.2,<8",
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.1,<2",
    "ruff>=0.12,<1",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[project.scripts]
nexusmcp = "nexusmcp.interfaces.cli.app:main"

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
markers = [
    "benchmark: deterministic performance evidence; full snapshot requires explicit opt-in",
    "integration: requires an isolated external dependency such as PostgreSQL",
    "external: requires an explicitly enabled paid network service",
]
testpaths = ["tests"]

[tool.ruff]
exclude = ["docs"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.basedpyright]
include = ["run.py", "src", "tests", "examples", "benchmarks"]
exclude = [".venv", "build", "dist"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
reportDeprecated = "error"
