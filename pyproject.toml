[project]
name = "nexusmcp"
version = "0.1.0"
description = "Enterprise MCP Gateway and Registry"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.116,<1",
    "mcp==2.0.0",
    "pydantic-settings>=2.10,<3",
    "uvicorn>=0.35,<1",
]

[dependency-groups]
dev = [
    "basedpyright>=1.31,<2",
    "httpx>=0.28,<1",
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.1,<2",
    "ruff>=0.12,<1",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
exclude = ["docs"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.basedpyright]
include = ["src", "tests", "examples"]
exclude = [".venv", "build", "dist"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
reportDeprecated = "error"
