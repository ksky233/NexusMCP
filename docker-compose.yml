name: nexusmcp

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: nexusmcp
      POSTGRES_USER: nexusmcp
      POSTGRES_PASSWORD: nexusmcp_dev
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      # PostgreSQL 18+ 会在该目录下创建按主版本区分的数据子目录。
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/01-init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexusmcp -d nexusmcp"]
      interval: 2s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  postgres_data:
